services:
  - type: web
    name: mangafire-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "false"
      - key: POOL_SIZE
        value: "3"
      - key: PORT
        value: "3000"
